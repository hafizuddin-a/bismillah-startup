name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    # the one-line installer from the README, against the real published release, in both flavours of PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with PowerShell 7
        shell: pwsh
        run: |
          $env:BISMILLAH_DIR = "$PWD/install7"; $env:BISMILLAH_NO_OPEN = '1'
          ./get.ps1
          (Get-Item install7/Bismillah.exe).VersionInfo.FileVersion
      - name: Install with Windows PowerShell 5.1 (what most people have)
        shell: powershell
        run: |
          $env:BISMILLAH_DIR = "$PWD/install5"; $env:BISMILLAH_NO_OPEN = '1'
          ./get.ps1
          (Get-Item install5/Bismillah.exe).VersionInfo.FileVersion
      - name: The installed app starts
        shell: pwsh
        run: |
          $p = Start-Process install5/Bismillah.exe -PassThru
          Start-Sleep 6
          if ($p.HasExited) { throw "the installed app exited with code $($p.ExitCode)" }
          "running, pid $($p.Id)"
          Stop-Process $p -Force

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Bismillah.sln --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Publish the app (self-contained single file)
        run: dotnet publish src/Bismillah.App -c Release -o dist/publish

      - name: Draw the real WPF frames to PNG files
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/publish/Bismillah.exe -ArgumentList '--render-frames', "$PWD/out" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          Get-ChildItem out | Format-Table Name, Length
          if ($p.ExitCode -ne 0 -or -not (Test-Path out/bismillah-frames.png)) { throw "rendering failed" }

      - name: Draw the frames of the README animations
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/publish/Bismillah.exe -ArgumentList '--render-gif-frames', "$PWD/gif-frames" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or -not (Test-Path gif-frames/wake.txt)) { throw "frame rendering failed" }
          (Get-ChildItem gif-frames).Count

      - name: Open the real popup windows and photograph the screen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/publish/Bismillah.exe -ArgumentList '--smoke', "$PWD/out" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          Get-ChildItem out | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { throw "popup smoke test failed" }

      - name: Start the whole app (tray icon, wake monitor, scheduler) and read back its menu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/publish/Bismillah.exe -ArgumentList '--smoke-host', "$PWD/out" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          Get-Content out/host-report.txt
          if ($p.ExitCode -ne 0) { throw "host smoke test failed" }

      - name: Update test (a signed release is installed in place, a forged one is refused)
        shell: pwsh
        run: ./tools/ci/update-test.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-frames
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: gif-frames
          path: gif-frames
      - uses: actions/upload-artifact@v4
        with:
          name: Bismillah-win-x64
          path: dist/publish/Bismillah.exe
